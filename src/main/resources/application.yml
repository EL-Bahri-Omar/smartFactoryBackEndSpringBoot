server:
  port: ${SERVER_PORT:${PORT:8080}}

spring:
  application:
    name: smartfactory-backend
  data:
    mongodb:
      uri: mongodb://localhost:27017/smartfactory
      auto-index-creation: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:workerdev547@gmail.com}
    password: ${MAIL_PASSWORD:vanh gtrc jakd idic}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: ${MAIL_FROM:noreply@smartfactory.com}
  firebase:
    enabled: ${FIREBASE_ENABLED:true}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:smartfactory-production-firebase-adminsdk-fbsvc-22cc907731.json}

otp:
  expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}
  max-attempts: ${OTP_MAX_ATTEMPTS:5}
  resend-delay-seconds: ${OTP_RESEND_DELAY_SECONDS:60}
  reset-token-expiration-minutes: ${RESET_TOKEN_EXPIRATION_MINUTES:15}

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351655468576D5A7134743777217A25432A
  expiration-ms: 86400000 # 24h

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:smartfactory-backend}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  topic: ${MQTT_TOPIC:factory/machines/#}
  qos: ${MQTT_QOS:1}
  auto-startup: ${MQTT_AUTO_STARTUP:true}

sensor:
  offline-timeout-seconds: ${SENSOR_OFFLINE_TIMEOUT_SECONDS:30}
  check-interval-ms: ${SENSOR_CHECK_INTERVAL_MS:10000}

mongodb:
  history:
    uri: ${MONGODB_HISTORY_URI:mongodb://localhost:27017/SmartFactoryHistory}
    database: ${MONGODB_HISTORY_DATABASE:SmartFactoryHistory}

history:
  batch:
    flush-interval-ms: ${HISTORY_FLUSH_INTERVAL_MS:20000} # 20 secondes par défaut
    buffer-capacity: ${HISTORY_BUFFER_CAPACITY:10000}
    immediate-persist: ${HISTORY_IMMEDIATE_PERSIST:false}
    max-retry-attempts: ${HISTORY_MAX_RETRY_ATTEMPTS:3}

logging:
  level:
    root: INFO
    com.smartfactory: DEBUG

